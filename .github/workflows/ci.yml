name: AgriWise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run TypeScript & ESLint Check
      run: npm run lint

    - name: Run Scientific ML & API Automated Test Suite
      run: npm test

    - name: Build Production Frontend Assets
      run: npm run build

    - name: Verify Docker Build
      run: docker build -t agriwise:latest .
